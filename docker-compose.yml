name: starrush-vds

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NEXT_PUBLIC_WS_URL: ${DOCKER_NEXT_PUBLIC_WS_URL:-}
      NEXT_PUBLIC_GATEWAY_PORT: ${DOCKER_NEXT_PUBLIC_GATEWAY_PORT:-8081}
  env_file:
    - .env
  environment:
    NODE_ENV: production
    DATABASE_URL: ${DOCKER_DATABASE_URL:?DOCKER_DATABASE_URL is required for docker-compose.yml (DBaaS mode)}
    REDIS_URL: ${DOCKER_REDIS_URL:?DOCKER_REDIS_URL is required for docker-compose.yml (DBaaS mode)}
    APP_INTERNAL_BASE_URL: ${APP_INTERNAL_BASE_URL:-http://app:3000}
    GATEWAY_INTERNAL_BASE_URL: ${GATEWAY_INTERNAL_BASE_URL:-http://gateway:8081}
    WORKER_INTERNAL_BASE_URL: ${WORKER_INTERNAL_BASE_URL:-http://worker:8082}
    ADMIN_STUDIO_DATABASE_URL: ${ADMIN_STUDIO_DATABASE_URL:-}
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  restart: unless-stopped

services:
  migrate:
    <<: *app-common
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  app:
    <<: *app-common
    command: ["npm", "run", "start"]
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  gateway:
    <<: *app-common
    command: ["npm", "run", "gateway"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DOCKER_DATABASE_URL:?DOCKER_DATABASE_URL is required for docker-compose.yml (DBaaS mode)}
      REDIS_URL: ${DOCKER_REDIS_URL:?DOCKER_REDIS_URL is required for docker-compose.yml (DBaaS mode)}
      GATEWAY_PORT: 8081
    expose:
      - "8081"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8081/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *app-common
    command: ["npm", "run", "worker:round"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DOCKER_DATABASE_URL:?DOCKER_DATABASE_URL is required for docker-compose.yml (DBaaS mode)}
      REDIS_URL: ${DOCKER_REDIS_URL:?DOCKER_REDIS_URL is required for docker-compose.yml (DBaaS mode)}
      APP_INTERNAL_BASE_URL: ${APP_INTERNAL_BASE_URL:-http://app:3000}
      WORKER_HEALTH_PORT: 8082
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8082/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@example.com}
      ADMIN_BASIC_AUTH_USER: ${ADMIN_BASIC_AUTH_USER:?ADMIN_BASIC_AUTH_USER is required for admin routes}
      ADMIN_BASIC_AUTH_HASH: ${ADMIN_BASIC_AUTH_HASH:?ADMIN_BASIC_AUTH_HASH is required for admin routes}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      app:
        condition: service_healthy
      gateway:
        condition: service_healthy

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
