services:
  postgres:
    image: postgres:18
    container_name: starrush-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: starrush
      POSTGRES_PASSWORD: starrush
      POSTGRES_DB: starrush
    ports:
      - "5432:5432"
    volumes:
      - starrush_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starrush -d starrush"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: starrush-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  starrush_pgdata:
    driver: local
