name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: starrush
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d starrush"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://ci:ci@localhost:5432/starrush?schema=public
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret
      TELEGRAM_BOT_TOKEN: ci-telegram-bot-token
      INTERNAL_API_KEY: ci-internal-key
      COOKIE_SECURE: "false"
      NEXT_PUBLIC_GATEWAY_PORT: "8081"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Apply Prisma schema
        run: npx prisma db push --skip-generate

      - name: Lint
        run: npm run lint

      - name: Encoding check
        run: npm run check:encoding

      - name: Build
        run: npm run build

      - name: Fast tests
        run: |
          npm run test:fairness
          npm run test:cashout-math
          npm run test:round-growth
          npm run test:snapshot-schema
