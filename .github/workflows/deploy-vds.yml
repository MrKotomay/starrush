name: Deploy VDS

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vds
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate required secrets
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
          VDS_SSH_KEY_B64: ${{ secrets.VDS_SSH_KEY_B64 }}
          VDS_APP_PATH: ${{ secrets.VDS_APP_PATH }}
          VDS_REPO_URL: ${{ secrets.VDS_REPO_URL }}
        run: |
          set -euo pipefail
          missing=0
          for name in VDS_HOST VDS_USER VDS_APP_PATH VDS_REPO_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not set"
              missing=1
            fi
          done
          if [ -z "${VDS_SSH_KEY:-}" ] && [ -z "${VDS_SSH_KEY_B64:-}" ]; then
            echo "::error::Either VDS_SSH_KEY or VDS_SSH_KEY_B64 must be set"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure SSH
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
          VDS_SSH_KEY_B64: ${{ secrets.VDS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          port="${VDS_PORT:-22}"
          install -m 700 -d ~/.ssh

          if [ -n "${VDS_SSH_KEY_B64:-}" ]; then
            printf "%s" "${VDS_SSH_KEY_B64}" | tr -d '\r\n' | base64 -d > ~/.ssh/id_ed25519
          else
            # Support both real multiline secrets and "\n"-escaped one-line secrets.
            if [[ "${VDS_SSH_KEY}" == *"\\n"* ]]; then
              printf "%s" "${VDS_SSH_KEY}" | sed 's/\\n/\n/g' | tr -d '\r' > ~/.ssh/id_ed25519
            else
              printf "%s" "${VDS_SSH_KEY}" | tr -d '\r' > ~/.ssh/id_ed25519
            fi
          fi

          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keyscan -p "${port}" "${VDS_HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH access to VDS
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_USER: ${{ secrets.VDS_USER }}
        run: |
          set -euo pipefail
          port="${VDS_PORT:-22}"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 -p "${port}" "${VDS_USER}@${VDS_HOST}" "echo SSH_OK"

      - name: Deploy exact git commit on server
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_APP_PATH: ${{ secrets.VDS_APP_PATH }}
          VDS_REPO_URL: ${{ secrets.VDS_REPO_URL }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          set -euo pipefail
          port="${VDS_PORT:-22}"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 -p "${port}" "${VDS_USER}@${VDS_HOST}" "APP_PATH='${VDS_APP_PATH}' REPO_URL='${VDS_REPO_URL}' DEPLOY_SHA='${DEPLOY_SHA}' DEPLOY_BRANCH='${DEPLOY_BRANCH}' bash -s" <<'EOF'
          set -euo pipefail

          if ! command -v git >/dev/null 2>&1; then
            echo "git is required on the server"
            exit 1
          fi

          mkdir -p "${APP_PATH}"

          if [ ! -d "${APP_PATH}/.git" ]; then
            mkdir -p "$(dirname "${APP_PATH}")"
            git clone "${REPO_URL}" "${APP_PATH}"
          fi

          cd "${APP_PATH}"

          current_remote="$(git remote get-url origin 2>/dev/null || true)"
          if [ "${current_remote}" != "${REPO_URL}" ]; then
            if [ -n "${current_remote}" ]; then
              git remote set-url origin "${REPO_URL}"
            else
              git remote add origin "${REPO_URL}"
            fi
          fi

          if ! git ls-remote --exit-code origin "refs/heads/${DEPLOY_BRANCH}" >/dev/null 2>&1; then
            echo "Cannot reach origin/${DEPLOY_BRANCH} from the server. Check VDS DNS/network and GitHub deploy key."
            exit 1
          fi

          git fetch --prune origin "${DEPLOY_BRANCH}"
          git reset --hard
          git clean -fd -e .env
          git checkout -B "${DEPLOY_BRANCH}" "origin/${DEPLOY_BRANCH}"
          git reset --hard "${DEPLOY_SHA}"
          git branch --set-upstream-to="origin/${DEPLOY_BRANCH}" "${DEPLOY_BRANCH}" || true

          bash infra/deploy/deploy-vds.sh
          EOF
