name: Deploy VDS

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vds
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate required secrets
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
          VDS_SSH_KEY_B64: ${{ secrets.VDS_SSH_KEY_B64 }}
          VDS_APP_PATH: ${{ secrets.VDS_APP_PATH }}
        run: |
          set -euo pipefail
          missing=0
          for name in VDS_HOST VDS_USER VDS_APP_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not set"
              missing=1
            fi
          done
          if [ -z "${VDS_SSH_KEY:-}" ] && [ -z "${VDS_SSH_KEY_B64:-}" ]; then
            echo "::error::Either VDS_SSH_KEY or VDS_SSH_KEY_B64 must be set"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure SSH
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
          VDS_SSH_KEY_B64: ${{ secrets.VDS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          port="${VDS_PORT:-22}"
          install -m 700 -d ~/.ssh

          if [ -n "${VDS_SSH_KEY_B64:-}" ]; then
            printf "%s" "${VDS_SSH_KEY_B64}" | tr -d '\r\n' | base64 -d > ~/.ssh/id_ed25519
          else
            # Support both real multiline secrets and "\n"-escaped one-line secrets.
            if [[ "${VDS_SSH_KEY}" == *"\\n"* ]]; then
              printf "%s" "${VDS_SSH_KEY}" | sed 's/\\n/\n/g' | tr -d '\r' > ~/.ssh/id_ed25519
            else
              printf "%s" "${VDS_SSH_KEY}" | tr -d '\r' > ~/.ssh/id_ed25519
            fi
          fi

          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keyscan -p "${port}" "${VDS_HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH access to VDS
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_USER: ${{ secrets.VDS_USER }}
        run: |
          set -euo pipefail
          port="${VDS_PORT:-22}"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 -p "${port}" "${VDS_USER}@${VDS_HOST}" "echo SSH_OK"

      - name: Upload source bundle to VDS
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_APP_PATH: ${{ secrets.VDS_APP_PATH }}
        run: |
          set -euo pipefail
          port="${VDS_PORT:-22}"
          archive="$(mktemp)"

          git archive --format=tar.gz --output="${archive}" HEAD

          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 -p "${port}" "${VDS_USER}@${VDS_HOST}" "mkdir -p '${VDS_APP_PATH}'"
          cat "${archive}" | ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 -p "${port}" "${VDS_USER}@${VDS_HOST}" "tar -xzf - -C '${VDS_APP_PATH}'"

      - name: Run deploy on server
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_APP_PATH: ${{ secrets.VDS_APP_PATH }}
        run: |
          set -euo pipefail
          port="${VDS_PORT:-22}"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 -p "${port}" "${VDS_USER}@${VDS_HOST}" "APP_PATH='${VDS_APP_PATH}' bash -s" <<'EOF'
          set -euo pipefail

          cd "${APP_PATH}"

          bash infra/deploy/deploy-vds.sh
          EOF
